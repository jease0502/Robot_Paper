<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="閉迴路延遲的反效果：以 40 毫秒延遲換取零相位的濾波器，在 0.5 公尺每秒時省下 12% 的熱且不跌倒，但在 1.0 公尺每秒時熱量反而上升且五分之一的回合跌倒；5 赫茲 Butterworth 更差，跌倒率達七成。不付延遲的 predictive 加 gate 方案在三種速度下都降低熱量且完全不跌倒。" font-family="ui-sans-serif, system-ui, -apple-system, 'Noto Sans TC', sans-serif">

  <text x="60" y="30" font-size="15" font-weight="600" fill="currentColor">延遲換平滑的代價，只在速度上限才看得到</text>

  <!-- legend -->
  <g font-size="11.5" fill="currentColor">
    <rect x="60" y="46" width="13" height="13" fill="var(--heat, #C4351F)" opacity="0.85"/><text x="79" y="57">zero-phase via 40 ms delay</text>
    <rect x="266" y="46" width="13" height="13" fill="var(--heat, #C4351F)" opacity="0.45"/><text x="285" y="57">Butterworth 5 Hz</text>
    <rect x="418" y="46" width="13" height="13" fill="var(--sig, #1F6F8B)"/><text x="437" y="57">predictive + gate（不付延遲）</text>
  </g>

  <!-- y axis -->
  <line x1="100" y1="70" x2="100" y2="350" stroke="currentColor" stroke-width="1.4"/>
  <g font-size="11" fill="currentColor" opacity="0.8" text-anchor="end">
    <line x1="94" y1="88" x2="100" y2="88" stroke="currentColor" stroke-width="1.2"/><text x="88" y="92">1.30</text>
    <line x1="94" y1="172" x2="100" y2="172" stroke="currentColor" stroke-width="1.2"/><text x="88" y="176">1.15</text>
    <line x1="94" y1="256" x2="100" y2="256" stroke="currentColor" stroke-width="1.2"/><text x="88" y="260">1.00</text>
    <line x1="94" y1="340" x2="100" y2="340" stroke="currentColor" stroke-width="1.2"/><text x="88" y="344">0.85</text>
  </g>
  <text x="34" y="210" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.8" transform="rotate(-90 34 210)">熱量  H / H(ZOH)</text>

  <!-- baseline -->
  <line x1="100" y1="256" x2="840" y2="256" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="846" y="253" font-size="11.5" font-weight="600" fill="currentColor">ZOH 基線</text>
  <text x="846" y="269" font-size="10.5" fill="currentColor" opacity="0.7">往上 = 更熱</text>

  <!-- ============ group 1: 0.5 m/s ============ -->
  <rect x="126" y="256" width="52" height="65.5" fill="var(--heat, #C4351F)" opacity="0.85"/>
  <rect x="194" y="256" width="52" height="67.2" fill="var(--heat, #C4351F)" opacity="0.45"/>
  <rect x="262" y="256" width="52" height="26.9" fill="var(--sig, #1F6F8B)"/>
  <text x="152" y="336" text-anchor="middle" font-size="11" fill="currentColor">0.883</text>
  <text x="220" y="337" text-anchor="middle" font-size="11" fill="currentColor">0.880</text>
  <text x="288" y="297" text-anchor="middle" font-size="11" fill="currentColor">0.952</text>
  <text x="220" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">0.5 m/s</text>
  <text x="220" y="392" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">跌倒率 0.00 / 0.00 / 0.00</text>
  <text x="220" y="412" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--heat, #C4351F)">延遲方案在這裡看起來最好</text>

  <!-- ============ group 2: 1.0 m/s ============ -->
  <rect x="366" y="111.5" width="52" height="144.5" fill="var(--heat, #C4351F)" opacity="0.85"/>
  <rect x="434" y="90.8" width="52" height="165.2" fill="var(--heat, #C4351F)" opacity="0.45"/>
  <rect x="502" y="256" width="52" height="42.6" fill="var(--sig, #1F6F8B)"/>
  <text x="392" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">1.258</text>
  <text x="460" y="83" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">1.295</text>
  <text x="528" y="313" text-anchor="middle" font-size="11" fill="currentColor">0.924</text>

  <text x="392" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">20%</text>
  <text x="460" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">70%</text>
  <text x="392" y="149" text-anchor="middle" font-size="10" fill="#fff">跌倒</text>
  <text x="460" y="128" text-anchor="middle" font-size="10" fill="currentColor">跌倒</text>
  <text x="528" y="331" text-anchor="middle" font-size="12" font-weight="700" fill="var(--sig, #1F6F8B)">0%</text>

  <text x="460" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">1.0 m/s</text>
  <text x="460" y="392" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">跌倒率 0.20 / 0.70 / 0.00</text>
  <text x="460" y="412" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--heat, #C4351F)">同一個濾波器，在這裡壞掉</text>

  <!-- ============ group 3: 0.3 + turn ============ -->
  <rect x="606" y="256" width="52" height="4.5" fill="var(--heat, #C4351F)" opacity="0.85"/>
  <rect x="674" y="256" width="52" height="5" fill="var(--heat, #C4351F)" opacity="0.45"/>
  <rect x="742" y="256" width="52" height="24.6" fill="var(--sig, #1F6F8B)"/>
  <text x="632" y="276" text-anchor="middle" font-size="11" fill="currentColor">0.992</text>
  <text x="700" y="292" text-anchor="middle" font-size="11" fill="currentColor">0.991</text>
  <text x="768" y="295" text-anchor="middle" font-size="11" fill="currentColor">0.956</text>
  <text x="700" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">0.3 m/s + turn</text>
  <text x="700" y="392" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">跌倒率 0.00 / 0.00 / 0.00</text>

  <!-- ============ bottom band ============ -->
  <line x1="60" y1="430" x2="880" y2="430" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="60" y="452" font-size="12.5" fill="currentColor">在無 effort 項的 policy 上，延遲方案整體跌倒率 <tspan font-weight="700" fill="var(--heat, #C4351F)">0.37</tspan>，在 1.0 m/s 是<tspan font-weight="700" fill="var(--heat, #C4351F)">每一個回合都跌</tspan>。最該被幫忙的 policy，被害得最慘。</text>
  <text x="60" y="468" font-size="11.5" fill="currentColor" opacity="0.72">只在低速評估濾波器，會把它記錄成成功，然後在部署時失敗。</text>
</svg>
